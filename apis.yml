aid: cognigy
name: Cognigy
description: >-
  Cognigy (now NiCE Cognigy, following NICE's 2024 acquisition) is an enterprise
  conversational and agentic AI platform for building, deploying, and operating
  AI Agents across voice, chat, and messaging channels. Cognigy.AI lets teams
  design conversational flows, connect large language models and knowledge bases,
  orchestrate omnichannel customer service automation, and augment human contact
  center agents with real-time Agent Copilot assistance. The platform exposes a
  comprehensive REST API (the Cognigy.AI API) for managing agents, snapshots,
  flows, endpoints, users, and organizations, an OData analytics endpoint,
  webhook and REST endpoints for real-time interactions, a Socket client for
  webchat, an embeddable Webchat widget, and a first-party command-line interface
  for managing local copies of virtual agent projects.
