apis:
- name: Cognigy.AI API
  description: >-
    The Cognigy.AI REST API for managing AI Agents throughout their lifecycle —
    deployment and snapshots, flow configuration and interaction, endpoints,
    resource monitoring, administration and user management, API key and token
    creation, debugging and logs, and the simulator. Any action available in the
    Cognigy.AI frontend can be queried or triggered through this API. Authentication
    is via an API key passed as an X-API-Key header or an api_key query parameter.
